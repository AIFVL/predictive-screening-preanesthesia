models:
  logistic_regression:
    enabled: true
    module: "sklearn.linear_model"
    class: "LogisticRegression"
    target_metric: "f2"
    params:
      C: 1.0
      class_weight: "balanced"
      solver: "lbfgs"
      max_iter: 1000
    search_space:
      C: [0.01, 0.1, 1.0, 10.0, 100.0]

  random_forest:
    enabled: true
    module: "sklearn.ensemble"
    class: "RandomForestClassifier"
    target_metric: "f2"
    params:
      n_estimators: 300
      max_depth: null
      class_weight: "balanced"
      random_state: 42
    search_space:
      n_estimators: [100, 200, 300, 500]
      max_depth: [null, 5, 10, 20]

  xgboost:
    enabled: true
    module: "xgboost"
    class: "XGBClassifier"
    target_metric: "f2"
    params:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      use_label_encoder: false
      eval_metric: "logloss"
      random_state: 42
    search_space:
      n_estimators: [100, 300, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [4, 6, 8]

  hist_gradient_boosting:
    enabled: true
    module: "sklearn.ensemble"
    class: "HistGradientBoostingClassifier"
    target_metric: "f2"
    params:
      max_iter: 300
      learning_rate: 0.05
      max_depth: null
      random_state: 42
    search_space:
      max_iter: [100, 200, 300]
      learning_rate: [0.01, 0.05, 0.1]
