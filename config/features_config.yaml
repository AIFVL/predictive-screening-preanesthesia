# Features numéricas base del preoperatorio
numerical_features:
  - Edad
  - Peso
  - Talla
  - IMC
  - "Tensión Arterial Sistólica (mm/Hg)"
  - "Tensión Arterial Diastólica (mm/Hg)"
  - "Tensión Arterial Media (mm/Hg)"
  - "Frecuencia Cardiaca (l/min)"
  - "Saturación de Oxigeno (%)"
  - "Temperatura (ºC)"
  - "Proteína C reactiva (mg/l)"

# Features a excluir explícitamente (además de identifier_columns de cleaning_config)
features_to_exclude: []

# Poda de features con baja varianza
feature_pruning:
  enabled: true
  min_variance: 0.01

