x-airflow-common: &airflow-common
  build: .
  user: "1000:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__PARALLELISM: "20"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "20"
    PYTHONPATH: /opt/airflow/project
    HF_HOME: /opt/airflow/hf_cache
    TRANSFORMERS_CACHE: /opt/airflow/hf_cache
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./config:/opt/airflow/project/config
    - ./src:/opt/airflow/project/src
    - ./data:/opt/airflow/project/data_raw
    - ./cache:/opt/airflow/project/cache
    - ./output:/opt/airflow/project/output
    - hf_cache:/opt/airflow/hf_cache
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db init && airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: preanesthesia-api:latest
    container_name: preanesthesia-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MODELS_DIR: /app/output/v2/models
      CACHE_DIR: /app/cache
      CONFIG_DIR: /app/config
      HF_HOME: /app/hf_cache
      LOG_LEVEL: "${API_LOG_LEVEL:-INFO}"
      CORS_ORIGINS: "${API_CORS_ORIGINS:-*}"
      MAX_BATCH_SIZE: "${API_MAX_BATCH_SIZE:-100}"
      MODEL_CACHE_SIZE: "${API_MODEL_CACHE_SIZE:-8}"
    volumes:
      - ./output:/app/output:ro
      - ./cache:/app/cache
      - ./config:/app/config:ro
      - hf_cache:/app/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${FRONTEND_API_URL:-http://localhost:8000}"
    image: preanesthesia-frontend:latest
    container_name: preanesthesia-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
  airflow_logs:
  airflow_output:
  airflow_cache:
